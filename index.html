<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>株式会社山源 | 再生可能エネルギー事業</title>

<meta name="description" content="株式会社山源は、太陽光発電・蓄電池を中心とした再生可能エネルギー事業を通じて、住まいと暮らしに新しい価値を提供します。">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800;900&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --white:#FFFFFF;

  /* 高級感のあるウォームホワイト */
  --luxury-white:#F3F0E8;

  --light:#EDEEEB;

  --light-gray:#E3E4DF;

  --navy:#3B2E16;

  --charcoal:#1F2937;

  --blue:#0084FF;

  --emerald:#00A896;

  --red:#E63946;

  /* 黒みのある落ち着いたゴールド */
  --muted-gold:#75684D;

  --muted-gold-light:#A79A7B;

  --gray:#64748B;

  --gray-light:#C6C5BE;

  /* 暖色系の罫線 */
  --line:#D7D2C6;

  --max:1180px;

  --shadow:0 14px 34px rgba(59,46,22,.055);

  --shadow-soft:0 6px 18px rgba(59,46,22,.035);

}

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

html{

  scroll-behavior:smooth;

}

body{

  font-family:'Noto Sans JP',

  -apple-system,

  BlinkMacSystemFont,

  'Helvetica Neue',

  Arial,

  sans-serif;

  color:var(--charcoal);

  background:var(--luxury-white);

  line-height:1.82;

  font-weight:400;

  -webkit-font-smoothing:antialiased;

  overflow-x:hidden;

}

img,

video{

  display:block;

  max-width:100%;

}

a{

  color:inherit;

  text-decoration:none;

}

button,

a{

  -webkit-tap-highlight-color:transparent;

}

.wrap{

  width:min(var(--max),calc(100% - 64px));

  margin:auto;

}

section{

  padding:42px 0;

}

h1,

h2,

h3,

h4{

  font-family:'Shippori Mincho',serif;

  color:var(--navy);

  font-weight:700;

  letter-spacing:.04em;

}

strong{

  font-weight:800;

  color:inherit;

}


/* =========================

HEADER

========================= */

header{

  position:fixed;

  top:0;

  left:0;

  width:100%;

  z-index:1000;

  background:rgba(243,240,232,.96);

  backdrop-filter:blur(18px);

  border-bottom:1px solid rgba(117,104,77,.16);

}

.header-inner{

  width:min(var(--max),calc(100% - 64px));

  min-height:72px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:space-between;

}

.brand{

  display:flex;

  align-items:center;

  gap:12px;

}

.brand-mark{

  width:40px;

  height:40px;

}

.brand-text{

  font-family:'Shippori Mincho',serif;

  font-size:20px;

  font-weight:700;

  letter-spacing:.12em;

  color:var(--navy);

}

.brand-text small{

  display:block;

  font-family:'Noto Sans JP',sans-serif;

  font-size:8px;

  letter-spacing:.28em;

  color:var(--gray);

  font-weight:500;

}

nav ul{

  display:flex;

  gap:26px;

  list-style:none;

}

nav a{

  position:relative;

  font-size:12px;

  letter-spacing:.06em;

  color:var(--charcoal);

  padding:4px 0;

}

nav a::after{

  content:"";

  position:absolute;

  left:0;

  bottom:0;

  width:0;

  height:1px;

  background:var(--muted-gold);

  transition:.3s;

}

nav a:hover::after{

  width:100%;

}


/* =========================

HERO

========================= */

.hero{

  position:relative;

  min-height:100svh;

  padding:125px 0 48px;

  display:flex;

  align-items:center;

  overflow:hidden;

  background:var(--navy);

}

.hero-video{

  position:absolute;

  inset:0;

  z-index:0;

  background:#000;

  overflow:hidden;

}

.hero-video video{

  width:100%;

  height:100%;

  object-fit:cover;

  object-position:center center;

}

.hero-video::after{

  content:"";

  position:absolute;

  inset:0;

  background:

    linear-gradient(

      90deg,

      rgba(0,0,0,.72) 0%,

      rgba(0,0,0,.43) 36%,

      rgba(0,0,0,.12) 72%,

      rgba(0,0,0,.04) 100%

    );

  z-index:1;

}

.hero-inner{

  position:relative;

  z-index:2;

  width:min(var(--max),calc(100% - 64px));

  margin:auto;

}

.hero-eyebrow{

  display:flex;

  align-items:center;

  gap:14px;

  color:var(--white);

  font-size:11px;

  letter-spacing:.28em;

  margin-bottom:17px;

}

.hero-eyebrow::before{

  content:"";

  width:42px;

  height:1px;

  background:var(--muted-gold-light);

}

.hero h1{

  color:var(--white);

  font-size:clamp(38px,5.6vw,70px);

  line-height:1.34;

  margin-bottom:20px;

}

.hero h1 strong{

  color:var(--white);

  font-weight:900;

}

.hero-lead{

  max-width:650px;

  color:rgba(255,255,255,.88);

  font-size:15px;

  line-height:1.92;

  margin-bottom:25px;

}

.hero-buttons{

  display:flex;

  gap:11px;

  flex-wrap:wrap;

}

.btn{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  min-width:190px;

  padding:13px 28px;

  font-size:13px;

  letter-spacing:.1em;

  border:1px solid transparent;

  transition:.3s;

}

.btn-primary{

  background:var(--blue);

  color:var(--white);

  border-color:var(--blue);

}

.btn-primary:hover{

  background:#006FD6;

  border-color:#006FD6;

}

.btn-outline{

  background:rgba(255,255,255,.05);

  color:var(--white);

  border-color:rgba(255,255,255,.60);

}

.btn-outline:hover{

  background:var(--white);

  color:var(--navy);

}


/* =========================

SECTION TITLE

========================= */

.section-head{

  max-width:720px;

  margin-bottom:28px;

}

.eyebrow{

  color:var(--muted-gold);

  font-size:11px;

  letter-spacing:.25em;

  font-weight:700;

  margin-bottom:7px;

}

.section-head h2{

  font-size:clamp(28px,3.6vw,44px);

  line-height:1.5;

}

.section-head p{

  margin-top:11px;

  color:var(--gray);

  font-size:14px;

  line-height:1.94;

}


/* =========================

PHOTO SYSTEM

========================= */

.photo-frame{

  overflow:hidden;

  background:var(--navy);

  position:relative;

  min-width:0;

  border-top:1px solid rgba(117,104,77,.30);

  border-bottom:1px solid rgba(117,104,77,.30);

}

.photo-frame img{

  width:100%;

  height:100%;

  object-fit:cover;

  transition:transform .8s cubic-bezier(.2,.7,.2,1);

}

.photo-frame:hover img{

  transform:scale(1.035);

}

.photo-overlay{

  position:absolute;

  inset:0;

  background:

    linear-gradient(

      180deg,

      transparent 28%,

      rgba(59,46,22,.84)

    );

}

.photo-caption{

  position:absolute;

  z-index:2;

  left:22px;

  right:22px;

  bottom:18px;

  color:var(--white);

}

.photo-caption small{

  color:var(--muted-gold-light);

  display:block;

  font-size:8px;

  letter-spacing:.22em;

  margin-bottom:3px;

}

.photo-caption strong{

  display:block;

  font-family:'Shippori Mincho',serif;

  font-size:19px;

  line-height:1.4;

}


/* =========================

ABOUT

========================= */

.about{

  background:var(--luxury-white);

}

.about-grid{

  display:grid;

  grid-template-columns:1.08fr .92fr;

  gap:45px;

  align-items:start;

}

.about-text p{

  color:var(--gray);

  font-size:15px;

  margin-bottom:15px;

}

.about-text strong{

  color:var(--navy);

}

.quote{

  background:var(--light);

  border-left:3px solid var(--muted-gold);

  padding:28px 27px;

  box-shadow:var(--shadow-soft);

}

.quote-label{

  display:block;

  color:var(--muted-gold);

  font-size:10px;

  letter-spacing:.24em;

  font-weight:700;

  margin-bottom:11px;

}

.quote h3{

  font-size:22px;

  line-height:1.7;

  margin-bottom:10px;

}

.quote p{

  color:var(--gray);

  font-size:12px;

}

.about-photo-wide{

  margin-top:28px;

  height:390px;

}


/* =========================

SOLAR VISUAL

========================= */

.solar-visual{

  position:relative;

  min-height:480px;

  overflow:hidden;

  background:var(--navy);

  padding:0;

}

.solar-visual-image{

  position:absolute;

  inset:0;

  background-image:

    url("https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?auto=format&fit=crop&w=2200&q=85");

  background-size:cover;

  background-position:center;

}

.solar-visual-overlay{

  position:absolute;

  inset:0;

  background:

    linear-gradient(

      90deg,

      rgba(59,46,22,.90) 0%,

      rgba(59,46,22,.54) 42%,

      rgba(59,46,22,.08) 100%

    );

}

.solar-content{

  position:relative;

  z-index:2;

  display:flex;

  align-items:center;

  min-height:480px;

}

.solar-content-inner{

  max-width:680px;

}

.solar-content .eyebrow{

  color:var(--muted-gold-light);

}

.solar-content h2{

  color:var(--white);

  font-size:clamp(30px,4vw,50px);

  line-height:1.5;

  margin-bottom:12px;

}

.solar-content p{

  max-width:570px;

  color:rgba(255,255,255,.82);

  font-size:14px;

  line-height:1.92;

}


/* =========================

MESSAGE

========================= */

.message{

  background:var(--light);

}

.message-grid{

  display:grid;

  grid-template-columns:300px 1fr;

  gap:42px;

  align-items:start;

}

.person{

  background:var(--luxury-white);

  border:1px solid var(--line);

  padding:28px 22px;

  text-align:center;

  box-shadow:var(--shadow-soft);

}

.person-logo{

  width:82px;

  height:82px;

  margin:0 auto 17px;

}

.person-role{

  color:var(--muted-gold);

  font-size:10px;

  letter-spacing:.2em;

  font-weight:700;

  margin-bottom:6px;

}

.person-name{

  font-family:'Shippori Mincho',serif;

  font-size:22px;

  font-weight:700;

  color:var(--navy);

  margin-bottom:3px;

}

.person-en{

  font-size:10px;

  letter-spacing:.14em;

  color:var(--gray);

  margin-bottom:14px;

}

.person-position{

  border-top:1px solid var(--line);

  padding-top:12px;

  color:var(--gray);

  font-size:12px;

}

.message-body p{

  color:var(--gray);

  font-size:15px;

  margin-bottom:16px;

}

.message-body p:first-child{

  color:var(--navy);

  font-family:'Shippori Mincho',serif;

  font-size:22px;

  font-weight:700;

  margin-bottom:20px;

}

.signature{

  margin-top:18px;

  color:var(--gray);

  font-size:13px;

}

.signature strong{

  display:block;

  color:var(--navy);

  font-family:'Shippori Mincho',serif;

  font-size:18px;

  margin-top:4px;

}


/* =========================

MESSAGE PHOTO

3枚横並び固定

========================= */

.message-photo-grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:8px;

  margin-top:25px;

}

.message-photo-grid .photo-frame{

  height:255px;

}


/* =========================

PHILOSOPHY

========================= */

.philosophy{

  background:var(--luxury-white);

}

.philosophy-grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  border-top:1px solid var(--line);

  border-left:1px solid var(--line);

}

.philosophy-card{

  padding:28px 23px;

  background:var(--luxury-white);

  border-right:1px solid var(--line);

  border-bottom:1px solid var(--line);

  transition:.3s;

}

.philosophy-card:hover{

  background:var(--light);

}

.card-number{

  color:var(--muted-gold);

  font-size:11px;

  letter-spacing:.2em;

  font-weight:800;

  margin-bottom:11px;

}

.philosophy-card h3{

  font-size:19px;

  line-height:1.58;

  margin-bottom:10px;

}

.philosophy-card p{

  color:var(--gray);

  font-size:13px;

  line-height:1.94;

}


/* =========================

PHILOSOPHY VISUAL

========================= */

.philosophy-visual{

  margin-top:30px;

  padding:32px;

  background:var(--navy);

  position:relative;

  overflow:hidden;

  border-top:1px solid rgba(117,104,77,.35);

  border-bottom:1px solid rgba(117,104,77,.35);

}

.philosophy-visual::before{

  content:"01";

  position:absolute;

  right:25px;

  top:-32px;

  font-size:165px;

  line-height:1;

  font-weight:900;

  color:rgba(255,255,255,.035);

}

.philosophy-visual-head{

  position:relative;

  z-index:2;

  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  gap:25px;

  margin-bottom:22px;

}

.philosophy-visual-head .eyebrow{

  color:var(--muted-gold-light);

}

.philosophy-visual-title{

  color:var(--white);

  font-family:'Shippori Mincho',serif;

  font-size:26px;

  line-height:1.5;

}

.philosophy-visual-sub{

  color:rgba(255,255,255,.50);

  font-size:10px;

  letter-spacing:.16em;

  text-align:right;

}

.product-flow{

  position:relative;

  z-index:2;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:7px;

}

.product-step{

  min-height:158px;

  padding:19px 17px;

  background:rgba(255,255,255,.065);

  border:1px solid rgba(255,255,255,.12);

  position:relative;

}

.product-step::after{

  content:"→";

  position:absolute;

  right:-15px;

  top:50%;

  transform:translateY(-50%);

  width:28px;

  height:28px;

  border-radius:50%;

  background:var(--muted-gold);

  color:var(--white);

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:5;

  font-weight:800;

  font-size:11px;

}

.product-step:last-child::after{

  display:none;

}

.product-step-number{

  font-size:10px;

  letter-spacing:.18em;

  color:var(--muted-gold-light);

  font-weight:800;

  margin-bottom:12px;

}

.product-step h4{

  color:var(--white);

  font-family:'Noto Sans JP',sans-serif;

  font-size:15px;

  margin-bottom:8px;

}

.product-step p{

  color:rgba(255,255,255,.61);

  font-size:11px;

  line-height:1.84;

}

.product-flow-bottom{

  position:relative;

  z-index:2;

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:7px;

  margin-top:7px;

}

.product-point{

  padding:13px 16px;

  background:var(--luxury-white);

  display:flex;

  align-items:center;

  gap:10px;

  border-top:1px solid rgba(117,104,77,.32);

}

.product-point-icon{

  width:29px;

  height:29px;

  flex:none;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:rgba(117,104,77,.12);

  color:var(--muted-gold);

  font-size:11px;

  font-weight:900;

}

.product-point strong{

  display:block;

  color:var(--navy);

  font-size:12px;

}

.product-point span{

  color:var(--gray);

  font-size:10px;

}


/* =========================

ISSUES

========================= */

.issue{

  background:var(--light);

}

.issue-grid{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:9px;

}

.issue-card{

  position:relative;

  background:var(--luxury-white);

  padding:23px 19px;

  border:1px solid var(--line);

  box-shadow:var(--shadow-soft);

}

.issue-icon{

  width:40px;

  height:40px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:1px solid rgba(230,57,70,.20);

  color:var(--red);

  font-weight:900;

  font-size:18px;

  margin-bottom:14px;

}

.issue-card h3{

  font-family:'Noto Sans JP',sans-serif;

  font-size:15px;

  margin-bottom:7px;

}

.issue-card p{

  color:var(--gray);

  font-size:12px;

  line-height:1.84;

}


/* =========================

ISSUE VISUAL

========================= */

.issue-visual{

  margin-top:28px;

  padding:31px;

  background:var(--luxury-white);

  border:1px solid var(--line);

  box-shadow:var(--shadow);

  border-top:1px solid rgba(117,104,77,.35);

}

.issue-visual-top{

  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  gap:25px;

  margin-bottom:22px;

}

.issue-visual-title{

  color:var(--navy);

  font-family:'Shippori Mincho',serif;

  font-size:25px;

  line-height:1.48;

}

.issue-visual-caption{

  color:var(--gray);

  font-size:11px;

  text-align:right;

  max-width:300px;

}

.margin-flow{

  display:grid;

  grid-template-columns:repeat(5,1fr);

  align-items:stretch;

  gap:0;

}

.margin-node{

  position:relative;

  min-height:128px;

  padding:17px 13px;

  border:1px solid var(--line);

  background:var(--light);

}

.margin-node:not(:last-child)::after{

  content:"";

  position:absolute;

  right:-9px;

  top:50%;

  width:16px;

  height:16px;

  border-top:2px solid var(--muted-gold-light);

  border-right:2px solid var(--muted-gold-light);

  transform:translateY(-50%) rotate(45deg);

  background:var(--light);

  z-index:3;

}

.margin-node-number{

  font-size:10px;

  color:var(--muted-gold);

  letter-spacing:.14em;

  margin-bottom:9px;

}

.margin-node h4{

  font-family:'Noto Sans JP',sans-serif;

  font-size:13px;

  margin-bottom:5px;

}

.margin-node p{

  color:var(--gray);

  font-size:10px;

  line-height:1.75;

}

.margin-node.cost{

  background:#FFF8F8;

  border-color:rgba(230,57,70,.20);

}

.margin-node.cost h4{

  color:var(--red);

}

.margin-bar{

  margin-top:15px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:11px;

}

.margin-meter{

  padding:14px;

  border:1px solid var(--line);

  background:var(--light);

}

.margin-meter-label{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:7px;

}

.margin-meter-label span{

  font-size:10px;

  color:var(--gray);

}

.margin-meter-label strong{

  color:var(--muted-gold);

  font-size:12px;

}

.meter-track{

  height:8px;

  background:var(--light-gray);

  overflow:hidden;

}

.meter-fill{

  height:100%;

  background:var(--red);

}

.meter-fill.short{

  width:32%;

}

.meter-fill.long{

  width:86%;

}


/* =========================

STRUCTURE

========================= */

.structure{

  background:var(--luxury-white);

}

.structure-intro{

  max-width:750px;

  margin-bottom:31px;

}

.structure-intro h2{

  font-size:clamp(28px,3.6vw,44px);

  line-height:1.53;

  margin-bottom:10px;

}

.structure-intro p{

  color:var(--gray);

  font-size:14px;

}

.structure-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

}

.structure-card{

  padding:26px;

  border:1px solid var(--line);

  background:var(--luxury-white);

}

.structure-card.good{

  border:2px solid var(--blue);

  box-shadow:var(--shadow);

}

.structure-label{

  display:inline-block;

  font-size:10px;

  letter-spacing:.2em;

  font-weight:800;

  margin-bottom:13px;

  padding:6px 10px;

  background:var(--light-gray);

  color:var(--charcoal);

}

.structure-card.good .structure-label{

  background:rgba(0,132,255,.08);

  color:var(--blue);

}

.flow{

  display:flex;

  flex-wrap:wrap;

  align-items:center;

  gap:5px;

  margin-top:16px;

}

.flow-item{

  padding:8px 11px;

  background:var(--light);

  border:1px solid var(--line);

  font-size:11px;

  color:var(--charcoal);

}
